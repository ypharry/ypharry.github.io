<li class="teaching-item">
  <p class="teaching-item__entry"><strong class="teaching-item__title">{{ post.title }}</strong> — {{ post.role }}{% if post.venue %}, {{ post.venue }}{% endif %} ({{ post.semester }} {{ post.date | date: "%Y" }}).{% if post.notes %} {{ post.notes }}{% endif %}{% if post.link %} <a href="{{ post.link }}">Course page</a>.{% endif %}</p>
</li>
